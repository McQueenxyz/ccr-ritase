<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CCR — Laporan Ritase</title>
  <meta name="theme-color" content="#171717" />
  <link rel="icon" href="assets/logo.svg" />

  <!-- ============================================================
       PEMUAT ASET ANTI-CACHE
       GitHub Pages mengirim "Cache-Control: max-age=600" untuk HTML dan
       <meta http-equiv> TIDAK diindahkan sebagian besar peramban. Akibatnya
       index.html bisa tertahan 10 menit dan penanda ?v= tak pernah terbaca.
       Solusi: muat CSS & JS aplikasi lewat skrip dengan penanda waktu, jadi
       aset SELALU versi terbaru walau HTML-nya masih dari cache.
       ============================================================ -->
  <script>
    (function () {
      window.__CCR_T = Date.now();
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "assets/style.css?t=" + window.__CCR_T;
      document.head.appendChild(l);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Aplikasi CCR memerlukan JavaScript. Aktifkan JavaScript di peramban Anda.</noscript>

  <!-- Pustaka pihak ketiga (jarang berubah, boleh di-cache) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/vendor/xlsx.full.min.js"></script>

  <!-- Kode aplikasi — dimuat berurutan dengan penanda waktu -->
  <script>
    (function () {
      var files = [
        "assets/gradient.js",
        "config.js",
        "assets/seed.js",
        "assets/ss6-codes.js",
        "assets/store.js",
        "assets/app.js"
      ];
      var t = window.__CCR_T || Date.now();
      (function next(i) {
        if (i >= files.length) return;
        var s = document.createElement("script");
        s.src = files[i] + "?t=" + t;
        s.async = false;
        s.onload = function () { next(i + 1); };
        s.onerror = function () {
          document.getElementById("app").innerHTML =
            '<div style="font:14px system-ui;padding:32px;text-align:center;color:#dc2626">' +
            'Gagal memuat <b>' + files[i] + '</b>.<br>Periksa koneksi lalu muat ulang halaman.</div>';
        };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
