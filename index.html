<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CCR — Laporan Ritase</title>
  <!-- Jangan simpan HTML di cache: GitHub Pages memasang max-age=600 sehingga
       pembaruan tidak terlihat sampai 10 menit. Tanpa ini, penanda ?v= tak terbaca. -->

  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#171717" />
  <link rel="icon" href="assets/logo.svg" />
  <link rel="stylesheet" href="assets/style.css?v=20260819g" />
</head>
<body>
  <div id="app"></div>

  <!-- Library Supabase (dipakai hanya saat APP_MODE = "supabase").
       Aman diabaikan saat mode lokal. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SheetJS (lokal, offline) — untuk Export Excel format SS6 -->
  <script src="assets/vendor/xlsx.full.min.js"></script>

  <!-- Kode aplikasi (?v= = cache-busting; naikkan angka tiap update) -->
  <script src="assets/gradient.js?v=20260819g"></script>
  <script src="config.js?v=20260819g"></script>
  <script src="assets/seed.js?v=20260819g"></script>
  <script src="assets/ss6-codes.js?v=20260819g"></script>
  <script src="assets/store.js?v=20260819g"></script>

</body>
</html>
